<style>
:root {
    --primary-maroon: #6B2D30;
    --primary-hover: #522123;
    --bg-beige: #F9F6F0;
    --card-bg: #FFFFFF;
    --border-color: #E6DFD5;
    --text-main: #2C2A29;
    --text-muted: #746B65;
    --soft-beige: #F2EBE2;
}

/* Asas halaman */
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background-color: var(--bg-beige);
    color: var(--text-main);
    font-family: Arial, sans-serif;
    line-height: 1.6;
}

/* Bekas utama */
.container {
    width: 100%;
    max-width: 700px;
    margin: 20px auto;
    padding: 28px;
    background-color: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 18px;
    box-shadow: 0 5px 20px rgba(44, 42, 41, 0.06);
}

/* Tajuk */
h1 {
    margin-top: 0;
    margin-bottom: 8px;
    color: var(--primary-maroon);
    text-align: center;
    font-size: 32px;
    letter-spacing: -0.5px;
}

.subtitle {
    margin-top: 0;
    margin-bottom: 24px;
    color: var(--text-muted);
    text-align: center;
    line-height: 1.7;
}

/* Tajuk ruangan teks Rumi dan Jawi */
label {
    display: block;
    margin: 20px 0 8px;
    color: var(--primary-maroon);
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 17px;
    font-weight: 500;
    letter-spacing: 0.4px;
}

/* Input dan pilihan */
select,
textarea,
input[type="text"] {
    display: block;
    width: 100%;
    padding: 13px 14px;
    border: 1px solid var(--border-color);
    border-radius: 10px;
    background-color: var(--card-bg);
    color: var(--text-main);
    font: inherit;
    transition: border-color 0.2s, box-shadow 0.2s;
}

/* Fokus input */
select:focus,
textarea:focus,
input[type="text"]:focus {
    outline: none;
    border-color: var(--primary-maroon);
    box-shadow: 0 0 0 3px rgba(107, 45, 48, 0.10);
}

/* Ruang memasukkan teks */
#input {
min-height: 130px;
resize: vertical;
font-family: 'Inter', Arial, sans-serif;
font-size: 17px;
line-height: 1.8;
color: var(--text-main);
}
/* Hasil tulisan Jawi */
#output {
direction: rtl;
text-align: right;
font-family: "Noto Naskh Arabic", "Amiri", serif;
font-size: 28px;
line-height: 2;
background-color: #FCFAF7;
overflow-wrap: anywhere;
}

/* Butang utama */
button,
.btn,
input[type="submit"] {
    display: inline-block;
    margin: 10px 5px 0 0;
    padding: 11px 18px;
    border: 1px solid var(--primary-maroon);
    border-radius: 9px;
    background-color: var(--primary-maroon);
    color: #FFFFFF;
    font-size: 15px;
    font-weight: 600;
    font-family: 'Playfair Display', Georgia;
    cursor: pointer;
    transition: background-color 0.2s, transform 0.2s;
}

button:hover,
.btn:hover,
input[type="submit"]:hover {
    background-color: var(--primary-hover);
}

button:active,
.btn:active {
    transform: translateY(1px);
}

/* Butang sekunder */
button.secondary,
.btn.secondary {
    background-color: var(--soft-beige);
    color: var(--primary-maroon);
    border-color: var(--border-color);
}

button.secondary:hover,
.btn.secondary:hover {
    background-color: #E9DED2;
}
/* BUTANG SALIN HASIL */
#copyButton {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;

    width: 100%;
    height: 76px;
    min-height: 76px;
    margin: 16px 0 10px;
    padding: 10px 16px;

    background-color: transparent;
    color: var(--primary-maroon);

    border: 1.5px solid var(--primary-maroon);
    border-radius: 20px;

    font-family: 'Playfair Display', Georgia, serif;
    font-size: 23px;
    font-weight: 600;

    cursor: pointer;
    transition: all 0.25s ease;
}

#copyButton .copy-icon {
    width: 28px;
    height: 28px;
    flex-shrink: 0;
}

#copyButton:hover {
    background-color: var(--primary-maroon);
    color: #FFFFFF;
}

#copyButton:active {
    transform: scale(0.99);
}

/* IKON SALIN */
#copyButton .copy-icon {
    width: 28px;
    height: 28px;
    flex-shrink: 0;
}

/* KESAN HOVER */
#copyButton:hover {
    background-color: var(--primary-maroon);
    color: #FFFFFF;
}

/* KESAN APABILA DITEKAN */
#copyButton:active {
    transform: scale(0.99);
}
/* Butang ketika proses berjalan */
button:disabled,
input[type="submit"]:disabled {
    opacity: 0.6;
    cursor: wait;
}

/* Mesej sistem */
#message {
    color: var(--text-muted);
    font-size: 14px;
    line-height: 1.7;
}

/* Mesej cadangan ejaan */
.notice {
    font-family: 'Inter', Arial, sans-serif;
    font-size: 16px;
    font-weight: 400;
    color: #666666;
    line-height: 1.6;
}

.suggestion {
    display: inline-block;
    margin: 4px;
    padding: 7px 11px;
    background-color: var(--soft-beige);
    color: var(--primary-maroon);
    border: 1px solid var(--border-color);
    border-radius: 7px;
    cursor: pointer;
    transition: background-color 0.2s;
}

.suggestion:hover {
    background-color: #E9DED2;
}

/* Nota kecil */
.note {
    color: var(--text-muted);
    font-size: 13px;
    line-height: 1.6;
}

/* Pautan */
a {
    color: var(--primary-maroon);
}

a:hover {
    color: var(--primary-hover);
}

<main class="container">

    <h1 class="logo">Jawi<span>OnTop</span></h1>

    Dibina untuk memudahkan pembelajaran Jawi
    </p>
    
<div class="translation-tabs">
    <button
        type="button"
        class="translation-tab active"
        id="rumiToJawi"
        onclick="changeMode('jawi')">
        Rumi → Jawi
    </button>

        type="button"

    </button>

        placeholder="Taip teks Bahasa Melayu di sini..."></textarea>

   <button id="mainButton" onclick="processText()" type="button">
    <span id="mainButtonText">Tukar ke Jawi</span>

    <svg class="main-button-icon"
         xmlns="http://www.w3.org/2000/svg"
         viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         stroke-width="1.8"
         stroke-linecap="round"
         stroke-linejoin="round"
         aria-hidden="true">

        <path d="m12 5 7 7-7 7"></path>
    </svg>
   </button>

        placeholder="Hasil akan dipaparkan di sini..."></textarea>

    <svg class="copy-icon"
         xmlns="http://www.w3.org/2000/svg"
         width="36" height="36"
         viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         stroke-width="1.6"
         stroke-linecap="round"
         stroke-linejoin="round"
         aria-hidden="true">
        <rect x="8" y="8" width="13" height="13" rx="2"></rect>
        <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"></path>
    </svg>

</button>

<script>
const input = document.getElementById("input");
const output = document.getElementById("output");
const message = document.getElementById("message");
const mainButton = document.getElementById("mainButton");

let currentMode = "jawi";

// Tukar fungsi terjemahan
function changeMode(newMode) {
    currentMode = newMode;

    const rumiTab = document.getElementById("rumiToJawi");
    const jawiTab = document.getElementById("jawiToRumi");

    // Tandakan butang yang aktif
    rumiTab.classList.toggle("active", newMode === "jawi");
    jawiTab.classList.toggle("active", newMode === "rumi");

    if (newMode === "jawi") {
        input.dir = "ltr";
        output.dir = "rtl";

        input.placeholder = "Taip teks Bahasa Melayu di sini...";
        document.getElementById("inputLabel").textContent =
            "Masukkan teks Rumi";

        document.getElementById("outputLabel").textContent =
            "Hasil tulisan Jawi";

      document.getElementById("mainButtonText").textContent = "Tukar ke Jawi";

    } else {
        input.dir = "rtl";
        output.dir = "ltr";

        input.placeholder = "Taip teks Jawi di sini...";
        document.getElementById("inputLabel").textContent =
            "Masukkan teks Jawi";

        document.getElementById("outputLabel").textContent =
            "Hasil tulisan Rumi";

        document.getElementById("mainButtonText").textContent = "Tukar ke Rumi";
    }

    output.value = "";
    message.textContent = "Sila masukkan teks.";
}

// Proses terjemahan
async function processText() {
    const text = input.value.trim();

    if (!text) {
        message.textContent = "Sila masukkan teks dahulu.";
        return;
    }

    const endpoint = currentMode === "jawi"
        ? "/convert"
        : "/reverse";

    mainButton.disabled = true;
    message.textContent = "Sedang menterjemah...";

    try {
        const response = await fetch(endpoint, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ text: text })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Terjemahan gagal.");
        }

        output.value = data.result;
        message.textContent = "Terjemahan selesai!";

    } catch (error) {
        console.error(error);
        message.textContent =
            "Terjemahan gagal. Sila cuba lagi.";

    } finally {
        mainButton.disabled = false;
    }
}

// Padam teks
function clearText() {
    input.value = "";
    output.value = "";
    message.textContent = "Ruangan telah dikosongkan.";
}

// Salin hasil terjemahan
async function copyText() {
    if (!output.value) {
        message.textContent = "Tiada teks untuk disalin.";
        return;
    }

    try {
        await navigator.clipboard.writeText(output.value);
        message.textContent = "Teks berjaya disalin!";

    } catch (error) {
        output.focus();
        output.select();

        message.textContent =
            "Sila salin teks yang telah dipilih.";
    }
}
    const menuButton = document.getElementById("menuButton");
const menuPanel = document.getElementById("menuPanel");

if (menuButton && menuPanel) {

    menuButton.addEventListener("click", function () {
        const isOpen = !menuPanel.hidden;

        menuPanel.hidden = isOpen;

        menuButton.setAttribute(
            "aria-expanded",
            String(!isOpen)
        );

        menuButton.setAttribute(
            "aria-label",
            isOpen ? "Buka menu" : "Tutup menu"
        );
    });

    // Tutup menu apabila pengguna memilih sesuatu
    menuPanel.querySelectorAll("a").forEach(function (link) {
        link.addEventListener("click", function () {
            menuPanel.hidden = true;

            menuButton.setAttribute(
                "aria-expanded",
                "false"
            );

            menuButton.setAttribute(
                "aria-label",
                "Buka menu"
            );
        });
    });

    // Tutup menu apabila pengguna menekan di luar menu
    document.addEventListener("click", function (event) {
        if (
            !menuPanel.hidden &&
            !menuPanel.contains(event.target) &&
            !menuButton.contains(event.target)
        ) {
            menuPanel.hidden = true;

            menuButton.setAttribute(
                "aria-expanded",
                "false"
            );

            menuButton.setAttribute(
                "aria-label",
                "Buka menu"
            );
        }
    });
}
</script>
</body>
</html>
