
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JawiOnTop</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --primary-maroon: #6B2D30;
    --primary-hover: #522123;
    --bg-beige: #F9F6F0;
    --card-bg: #FFFFFF;
    --border-color: #E6DFD5;
    --text-main: #2C2A29;
    --text-muted: #746B65;
    --soft-beige: #F2EBE2;
}

/* Asas halaman */
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background-color: var(--bg-beige);
    color: var(--text-main);
    font-family: Arial, sans-serif;
    line-height: 1.6;
}

/* Bekas utama */
.container {
    width: 100%;
    max-width: 700px;
    margin: 20px auto;
    padding: 28px;
    background-color: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 18px;
    box-shadow: 0 5px 20px rgba(44, 42, 41, 0.06);
}

/* Tajuk */
h1 {
    margin-top: 0;
    margin-bottom: 8px;
    color: var(--primary-maroon);
    text-align: center;
    font-size: 32px;
    letter-spacing: -0.5px;
}

.subtitle {
    margin-top: 0;
    margin-bottom: 24px;
    color: var(--text-muted);
    text-align: center;
    line-height: 1.7;
}

/* Label */
label {
    display: block;
    margin: 20px 0 8px;
    color: var(--text-main);
    font-weight: 600;
}

/* Input dan pilihan */
select,
textarea,
input[type="text"] {
    display: block;
    width: 100%;
    padding: 13px 14px;
    border: 1px solid var(--border-color);
    border-radius: 10px;
    background-color: var(--card-bg);
    color: var(--text-main);
    font: inherit;
    transition: border-color 0.2s, box-shadow 0.2s;
}

/* Fokus input */
select:focus,
textarea:focus,
input[type="text"]:focus {
    outline: none;
    border-color: var(--primary-maroon);
    box-shadow: 0 0 0 3px rgba(107, 45, 48, 0.10);
}

/* Ruang memasukkan teks */
textarea {
    min-height: 130px;
    resize: vertical;
    font-size: 17px;
}

/* Hasil tulisan Jawi */
#output {
    direction: rtl;
    text-align: right;
    font-size: 25px;
    line-height: 1.9;
    background-color: #FCFAF7;
    overflow-wrap: anywhere;
}

/* Butang utama */
button,
.btn,
input[type="submit"] {
    display: inline-block;
    margin: 10px 5px 0 0;
    padding: 11px 18px;
    border: 1px solid var(--primary-maroon);
    border-radius: 9px;
    background-color: var(--primary-maroon);
    color: #FFFFFF;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background-color 0.2s, transform 0.2s;
}

button:hover,
.btn:hover,
input[type="submit"]:hover {
    background-color: var(--primary-hover);
}

button:active,
.btn:active {
    transform: translateY(1px);
}

/* Butang sekunder */
button.secondary,
.btn.secondary {
    background-color: var(--soft-beige);
    color: var(--primary-maroon);
    border-color: var(--border-color);
}

button.secondary:hover,
.btn.secondary:hover {
    background-color: #E9DED2;
}

/* Butang ketika proses berjalan */
button:disabled,
input[type="submit"]:disabled {
    opacity: 0.6;
    cursor: wait;
}

/* Mesej sistem */
#message {
    color: var(--text-muted);
    font-size: 14px;
    line-height: 1.7;
}

/* Cadangan ejaan */
#suggestions {
    margin-top: 16px;
    line-height: 1.8;
}

.suggestion {
    display: inline-block;
    margin: 4px;
    padding: 7px 11px;
    background-color: var(--soft-beige);
    color: var(--primary-maroon);
    border: 1px solid var(--border-color);
    border-radius: 7px;
    cursor: pointer;
    transition: background-color 0.2s;
}

.suggestion:hover {
    background-color: #E9DED2;
}

/* Nota kecil */
.note {
    color: var(--text-muted);
    font-size: 13px;
    line-height: 1.6;
}

/* Pautan */
a {
    color: var(--primary-maroon);
}

a:hover {
    color: var(--primary-hover);
}

/* PAPARAN TELEFON */
@media (max-width: 550px) {
    .logo {
        font-size: 36px;
        letter-spacing: -1px;
        padding: 6px;
    }

    .container {
        margin: 10px auto;
        padding: 20px 16px;
        border-radius: 14px;
    }

    h1 {
        font-size: 27px;
    }

    textarea {
        font-size: 16px;
    }

    #output {
        font-size: 22px;
    }

    button,
    .btn,
    input[type="submit"] {
        margin-right: 3px;
    }

    .translation-tab {
        padding: 12px 4px;
        font-size: 12px;
    }
}

/* LOGO JAWIONTOP */
.logo {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 50px;
    font-weight: 600;
    letter-spacing: -1.5px;
    color: #5B1720;
    text-align: center;
    margin: 0 0 8px;
}

.logo span {
    font-family: 'Playfair Display', Georgia, serif;
    color: #B18A60;
}

/* FONT TAJUK */
h1,
h2,
h3 {
    font-family: 'Playfair Display', Georgia, serif;
}

/* FONT TEKS BIASA */
body {
    font-family: 'Inter', Arial, sans-serif;
}

/* BEKAS BUTANG TERJEMAHAN */
.translation-tabs {
    display: flex;
    width: 100%;
    gap: 6px;
    padding: 5px;
    margin-top: 8px;
    background-color: var(--soft-beige);
    border-radius: 12px;
}

/* BUTANG RUMI-JAWI DAN JAWI-RUMI */
.translation-tab {
    flex: 1;
    min-width: 0;
    margin: 0;
    padding: 12px 8px;
    border: 1px solid transparent;
    border-radius: 9px;
    background-color: transparent;
    color: var(--primary-maroon);
    font-family: 'Inter', Arial, sans-serif;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
}

/* BUTANG TERJEMAHAN AKTIF */
.translation-tab.active {
    background-color: var(--primary-maroon);
    color: #FFFFFF;
}

/* HOVER BUTANG TIDAK AKTIF */
.translation-tab:hover:not(.active) {
    background-color: #E9DED2;
    color: var(--primary-maroon);
}

/* BUTANG SEMAK EJAAN */
.spell-tab {
    display: block;
    width: 100%;
    margin: 10px 0 0;
    padding: 11px;
    border: 1px solid var(--border-color);
    border-radius: 9px;
    background-color: transparent;
    color: var(--text-muted);
    font-family: 'Inter', Arial, sans-serif;
    font-size: 13px;
    text-align: center;
}

/* SEMAK EJAAN AKTIF */
.spell-tab.active {
    background-color: var(--primary-maroon);
    border-color: var(--primary-maroon);
    color: #FFFFFF;
}

/* HOVER SEMAK EJAAN */
.spell-tab:hover:not(.active) {
    background-color: var(--soft-beige);
    color: var(--primary-maroon);
}
    /* Butang terjemahan utama */
#mainButton {
    display: block;
    width: 100%;
    margin: 16px 0 10px;
    padding: 14px 20px;

    background-color: var(--primary-maroon);
    color: #FFFFFF;

    border: none;
    border-radius: 12px;

    font-family: 'Inter', Arial, sans-serif;
    font-size: 16px;
    font-weight: 600;

    cursor: pointer;
    transition: all 0.25s ease;
}

/* Kesan apabila tetikus berada di atas butang */
#mainButton:hover {
    background-color: var(--primary-hover);
    transform: translateY(-2px);
    box-shadow: 0 5px 12px rgba(107, 45, 48, 0.18);
}

/* Kesan apabila butang ditekan */
#mainButton:active {
    transform: translateY(0);
}
</style>
</head>
    
<body>

<main class="container">

    <h1 class="logo">Jawi<span>OnTop</span></h1>

    <p class="subtitle">
        Jawi, but make it easy!
    </p>
    
<div class="translation-tabs">
    <button
        type="button"
        class="translation-tab active"
        id="rumiToJawi"
        onclick="changeMode('jawi')">
        Rumi → Jawi
    </button>

    <button
        type="button"
        class="translation-tab"
        id="jawiToRumi"
        onclick="changeMode('rumi')">
        Jawi → Rumi
    </button>
</div>
    <label for="input" id="inputLabel">Masukkan teks Rumi</label>
    <textarea id="input"
        placeholder="Taip teks Bahasa Melayu di sini..."></textarea>

    <button id="mainButton" onclick="processText()">
        Tukar ke Jawi
    </button>
    <button class="secondary" onclick="clearText()">Padam</button>

    <label for="output" id="outputLabel">Hasil tulisan Jawi</label>
    <textarea id="output" readonly
        placeholder="Hasil akan dipaparkan di sini..."></textarea>

    <button class="secondary" onclick="copyText()">Salin hasil</button>

    <div id="suggestions"></div>
    <p id="message" role="status" aria-live="polite">
        Selamat datang ke JawiOnTop!
    </p>

    <p class="note">
        Cadangan ejaan berdasarkan kamus. Sila semak hasil sebelum digunakan.
    </p>
</main>

<script>
const input = document.getElementById("input");
const output = document.getElementById("output");
const message = document.getElementById("message");
const mainButton = document.getElementById("mainButton");

let currentMode = "jawi";

// Tukar fungsi terjemahan
function changeMode(newMode) {
    currentMode = newMode;

    const rumiTab = document.getElementById("rumiToJawi");
    const jawiTab = document.getElementById("jawiToRumi");

    // Tandakan butang yang aktif
    rumiTab.classList.toggle("active", newMode === "jawi");
    jawiTab.classList.toggle("active", newMode === "rumi");

    if (newMode === "jawi") {
        input.dir = "ltr";
        output.dir = "rtl";

        input.placeholder = "Taip teks Bahasa Melayu di sini...";
        document.getElementById("inputLabel").textContent =
            "Masukkan teks Rumi";

        document.getElementById("outputLabel").textContent =
            "Hasil tulisan Jawi";

        mainButton.textContent = "Tukar ke Jawi";

    } else {
        input.dir = "rtl";
        output.dir = "ltr";

        input.placeholder = "Taip teks Jawi di sini...";
        document.getElementById("inputLabel").textContent =
            "Masukkan teks Jawi";

        document.getElementById("outputLabel").textContent =
            "Hasil tulisan Rumi";

        mainButton.textContent = "Tukar ke Rumi";
    }

    output.value = "";
    message.textContent = "Sila masukkan teks.";
}

// Proses terjemahan
async function processText() {
    const text = input.value.trim();

    if (!text) {
        message.textContent = "Sila masukkan teks dahulu.";
        return;
    }

    const endpoint = currentMode === "jawi"
        ? "/convert"
        : "/reverse";

    mainButton.disabled = true;
    message.textContent = "Sedang menterjemah...";

    try {
        const response = await fetch(endpoint, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ text: text })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Terjemahan gagal.");
        }

        output.value = data.result;
        message.textContent = "Terjemahan selesai!";

    } catch (error) {
        console.error(error);
        message.textContent =
            "Terjemahan gagal. Sila cuba lagi.";

    } finally {
        mainButton.disabled = false;
    }
}

// Padam teks
function clearText() {
    input.value = "";
    output.value = "";
    message.textContent = "Ruangan telah dikosongkan.";
}

// Salin hasil terjemahan
async function copyText() {
    if (!output.value) {
        message.textContent = "Tiada teks untuk disalin.";
        return;
    }

    try {
        await navigator.clipboard.writeText(output.value);
        message.textContent = "Teks berjaya disalin!";

    } catch (error) {
        output.focus();
        output.select();

        message.textContent =
            "Sila salin teks yang telah dipilih.";
    }
}
</script>
</body>
</html>
