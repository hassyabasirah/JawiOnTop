
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JawiOnTop</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --primary-maroon: #6B2D30;
    --primary-hover: #522123;
    --bg-beige: #F9F6F0;
    --card-bg: #FFFFFF;
    --border-color: #E6DFD5;
    --text-main: #2C2A29;
    --text-muted: #746B65;
    --soft-beige: #F2EBE2;
}

/* Asas halaman */
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background-color: var(--bg-beige);
    color: var(--text-main);
    font-family: Arial, sans-serif;
    line-height: 1.6;
}

/* Bekas utama */
.container {
    width: 100%;
    max-width: 700px;
    margin: 20px auto;
    padding: 28px;
    background-color: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 18px;
    box-shadow: 0 5px 20px rgba(44, 42, 41, 0.06);
}

/* Tajuk */
h1 {
    margin-top: 0;
    margin-bottom: 8px;
    color: var(--primary-maroon);
    text-align: center;
    font-size: 32px;
    letter-spacing: -0.5px;
}

.subtitle {
    margin-top: 0;
    margin-bottom: 24px;
    color: var(--text-muted);
    text-align: center;
    line-height: 1.7;
}

/* Label */
label {
    display: block;
    margin: 20px 0 8px;
    color: var(--text-main);
    font-weight: 600;
}

/* Input dan pilihan */
select,
textarea,
input[type="text"] {
    display: block;
    width: 100%;
    padding: 13px 14px;
    border: 1px solid var(--border-color);
    border-radius: 10px;
    background-color: var(--card-bg);
    color: var(--text-main);
    font: inherit;
    transition: border-color 0.2s, box-shadow 0.2s;
}

/* Fokus input */
select:focus,
textarea:focus,
input[type="text"]:focus {
    outline: none;
    border-color: var(--primary-maroon);
    box-shadow: 0 0 0 3px rgba(107, 45, 48, 0.10);
}

/* Ruang memasukkan teks */
textarea {
    min-height: 130px;
    resize: vertical;
    font-size: 17px;
}

/* Hasil tulisan Jawi */
#output {
    direction: rtl;
    text-align: right;
    font-size: 25px;
    line-height: 1.9;
    background-color: #FCFAF7;
    overflow-wrap: anywhere;
}

/* Butang utama */
button,
.btn,
input[type="submit"] {
    display: inline-block;
    margin: 10px 5px 0 0;
    padding: 11px 18px;
    border: 1px solid var(--primary-maroon);
    border-radius: 9px;
    background-color: var(--primary-maroon);
    color: #FFFFFF;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background-color 0.2s, transform 0.2s;
}

button:hover,
.btn:hover,
input[type="submit"]:hover {
    background-color: var(--primary-hover);
}

button:active,
.btn:active {
    transform: translateY(1px);
}

/* Butang sekunder */
button.secondary,
.btn.secondary {
    background-color: var(--soft-beige);
    color: var(--primary-maroon);
    border-color: var(--border-color);
}

button.secondary:hover,
.btn.secondary:hover {
    background-color: #E9DED2;
}

/* Butang ketika proses berjalan */
button:disabled,
input[type="submit"]:disabled {
    opacity: 0.6;
    cursor: wait;
}

/* Mesej sistem */
#message {
    color: var(--text-muted);
    font-size: 14px;
    line-height: 1.7;
}

/* Cadangan ejaan */
#suggestions {
    margin-top: 16px;
    line-height: 1.8;
}

.suggestion {
    display: inline-block;
    margin: 4px;
    padding: 7px 11px;
    background-color: var(--soft-beige);
    color: var(--primary-maroon);
    border: 1px solid var(--border-color);
    border-radius: 7px;
    cursor: pointer;
    transition: background-color 0.2s;
}

.suggestion:hover {
    background-color: #E9DED2;
}

/* Nota kecil */
.note {
    color: var(--text-muted);
    font-size: 13px;
    line-height: 1.6;
}

/* Pautan */
a {
    color: var(--primary-maroon);
}

a:hover {
    color: var(--primary-hover);
}

/* Paparan telefon */
@media (max-width: 480px) {
    body {
        padding: 12px;
    }

    .container {
        margin: 10px auto;
        padding: 20px 16px;
        border-radius: 14px;
    }

    h1 {
        font-size: 27px;
    }

    textarea {
        font-size: 16px;
    }

    #output {
        font-size: 22px;
    }

    button,
    .btn,
    input[type="submit"] {
        margin-right: 3px;
    }

    .logo,
.logo span,
h1.logo,
.navbar-brand,
.brand-name {
    font-family: 'Playfair Display', Georgia, serif !important;
    font-weight: 600 !important;
    letter-spacing: -1px;
}

.logo {
    color: #5B1720 !important;
}

.logo span {
    color: #B18A60 !important;
}
    
</style>
</head>

<body>
<main class="container">
    <h1>JawiOnTop</h1>
    <p class="subtitle">
        Jawi, but make it easy!
    </p>

    <label for="mode">Pilih fungsi</label>
    <select id="mode" onchange="updateMode()">
        <option value="jawi">Rumi → Jawi</option>
        <option value="rumi">Jawi → Rumi</option>
        <option value="spell">Semak ejaan Rumi</option>
    </select>

    <label for="input" id="inputLabel">Masukkan teks Rumi</label>
    <textarea id="input"
        placeholder="Taip teks Bahasa Melayu di sini..."></textarea>

    <button id="mainButton" onclick="processText()">
        Tukar ke Jawi
    </button>
    <button class="secondary" onclick="clearText()">Padam</button>

    <label for="output" id="outputLabel">Hasil tulisan Jawi</label>
    <textarea id="output" readonly
        placeholder="Hasil akan dipaparkan di sini..."></textarea>

    <button class="secondary" onclick="copyText()">Salin hasil</button>

    <div id="suggestions"></div>
    <p id="message" role="status" aria-live="polite">
        Selamat datang ke JawiOnTop!
    </p>

    <p class="note">
        Cadangan ejaan berdasarkan kamus. Sila semak hasil sebelum digunakan.
    </p>
</main>

<script>
const input = document.getElementById("input");
const output = document.getElementById("output");
const message = document.getElementById("message");
const mode = document.getElementById("mode");
const mainButton = document.getElementById("mainButton");
const suggestionsBox = document.getElementById("suggestions");

function updateMode() {
    suggestionsBox.replaceChildren();
    output.value = "";

    if (mode.value === "jawi") {
        input.dir = "ltr";
        input.placeholder = "Taip teks Rumi di sini...";
        document.getElementById("inputLabel").textContent =
            "Masukkan teks Rumi";
        document.getElementById("outputLabel").textContent =
            "Hasil tulisan Jawi";
        output.dir = "rtl";
        mainButton.textContent = "Tukar ke Jawi";

    } else if (mode.value === "rumi") {
        input.dir = "rtl";
        input.placeholder = "اكتب النص الجاوي هنا";
        document.getElementById("inputLabel").textContent =
            "Masukkan teks Jawi";
        document.getElementById("outputLabel").textContent =
            "Hasil tulisan Rumi";
        output.dir = "ltr";
        mainButton.textContent = "Tukar ke Rumi";

    } else {
        input.dir = "ltr";
        input.placeholder = "Taip ayat Bahasa Melayu untuk disemak...";
        document.getElementById("inputLabel").textContent =
            "Teks yang hendak disemak";
        document.getElementById("outputLabel").textContent =
            "Teks selepas pembetulan";
        output.dir = "ltr";
        mainButton.textContent = "Semak ejaan";
    }

    message.textContent = "Sila masukkan teks.";
}

async function processText() {
    const text = input.value.trim();

    if (!text) {
        message.textContent = "Sila masukkan teks dahulu.";
        return;
    }

    const endpoint = {
        jawi: "/convert",
        rumi: "/reverse",
        spell: "/spellcheck"
    }[mode.value];

    mainButton.disabled = true;
    suggestionsBox.replaceChildren();
    message.textContent = "Sedang memproses...";

    try {
        const response = await fetch(endpoint, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({text})
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Permintaan gagal.");
        }

        if (mode.value === "spell") {
            output.value = text;
            showSuggestions(data.suggestions || []);
        } else {
            output.value = data.result;
        }

    } catch (error) {
        console.error(error);
        message.textContent =
            "Tidak berjaya. Periksa sambungan dan log server.";
    } finally {
        mainButton.disabled = false;
    }
}

function showSuggestions(items) {
    suggestionsBox.replaceChildren();

    if (items.length === 0) {
        message.textContent =
            "Tiada perkataan mencurigakan ditemui dalam kamus. Ini bukan jaminan semua ejaan betul.";
        return;
    }

    message.textContent =
        "Perkataan yang mungkin perlu disemak. Klik cadangan untuk menggantikannya:";

    items.forEach(item => {
        const section = document.createElement("div");
        const title = document.createElement("strong");
        title.textContent = item.word + ": ";
        section.appendChild(title);

        item.suggestions.forEach(candidate => {
            const button = document.createElement("button");
            button.className = "suggestion";
            button.type = "button";
            button.textContent = candidate;

            button.addEventListener("click", () => {
                replaceWord(item.word, candidate);
            });

            section.appendChild(button);
        });

        suggestionsBox.appendChild(section);
    });
}

function replaceWord(original, replacement) {
    const escaped = original.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const pattern = new RegExp("\\b" + escaped + "\\b", "gi");

    input.value = input.value.replace(pattern, match => {
        if (match === match.toUpperCase()) {
            return replacement.toUpperCase();
        }
        if (match[0] === match[0].toUpperCase()) {
            return replacement[0].toUpperCase() + replacement.slice(1);
        }
        return replacement;
    });

    output.value = input.value;
    message.textContent =
        "Cadangan digunakan. Tekan Semak ejaan sekali lagi untuk menyemak semula.";
}

function clearText() {
    input.value = "";
    output.value = "";
    suggestionsBox.replaceChildren();
    message.textContent = "Ruangan telah dikosongkan.";
}

async function copyText() {
    if (!output.value) {
        message.textContent = "Tiada teks untuk disalin.";
        return;
    }

    try {
        await navigator.clipboard.writeText(output.value);
        message.textContent = "Teks berjaya disalin!";
    } catch {
        output.focus();
        output.select();
        message.textContent =
            "Teks dipilih. Salin menggunakan fungsi Copy pada peranti.";
    }
}
</script>
</body>
</html>
