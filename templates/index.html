
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap');

:root {
    --maroon: #641E2B;
    --maroon-dark: #45121D;
    --maroon-light: #8C4552;
    --beige: #F5EFE6;
    --cream: #FFFCF7;
    --gold: #C4A16A;
    --gold-light: #E8D7B9;
    --text: #35272A;
    --muted: #85777A;
    --border: #E7DCD0;
    --white: #FFFFFF;
    --shadow: 0 12px 35px rgba(75, 29, 38, 0.09);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 45px 18px;
    font-family: 'Inter', sans-serif;
    color: var(--text);
    background:
        radial-gradient(ellipse at top left,
            rgba(196, 161, 106, 0.12), transparent 40%),
        linear-gradient(135deg, var(--beige), var(--cream));
}

.container {
    position: relative;
    max-width: 760px;
    margin: 15px auto;
    padding: 38px;
    background: rgba(255, 252, 247, 0.96);
    border: 1px solid var(--border);
    border-radius: 24px;
    box-shadow: var(--shadow);
    overflow: hidden;
}

/* Decorative accent */
.container::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 5px;
    background: linear-gradient(
        90deg,
        var(--maroon-dark),
        var(--gold),
        var(--maroon-light)
    );
}

h1 {
    margin: 5px 0 10px;
    text-align: center;
    font-family: 'Playfair Display', serif;
    font-size: clamp(36px, 6vw, 50px);
    font-weight: 700;
    letter-spacing: -1.5px;
    color: var(--maroon);
}

.subtitle {
    margin: 0 0 35px;
    text-align: center;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.8;
}

label {
    display: block;
    margin: 24px 0 10px;
    color: var(--maroon);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.2px;
}

select,
textarea {
    display: block;
    width: 100%;
    padding: 15px 16px;
    color: var(--text);
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 12px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    transition: border-color 0.2s, box-shadow 0.2s;
}

select {
    cursor: pointer;
}

textarea {
    min-height: 145px;
    resize: vertical;
    line-height: 1.8;
}

select:focus,
textarea:focus {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 0 4px rgba(196, 161, 106, 0.14);
}

#output {
    direction: rtl;
    text-align: right;
    font-family: 'Noto Naskh Arabic', serif;
    font-size: 25px;
    background: #F8F3EC;
    color: var(--maroon-dark);
}

button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 15px 7px 0 0;
    padding: 13px 22px;
    border: 1px solid var(--maroon);
    border-radius: 10px;
    background: var(--maroon);
    color: var(--white);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
}

button:hover:not(:disabled) {
    background: var(--maroon-dark);
    box-shadow: 0 5px 14px rgba(100, 30, 43, 0.16);
    transform: translateY(-1px);
}

button:focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 3px;
}

button.secondary {
    background: transparent;
    color: var(--maroon);
    border-color: var(--gold);
}

button.secondary:hover:not(:disabled) {
    background: var(--beige);
}

button:disabled {
    opacity: 0.65;
    cursor: wait;
    transform: none;
}

#suggestions {
    margin-top: 20px;
    padding: 0;
    line-height: 1.9;
}

.suggestion {
    display: inline-flex;
    margin: 5px 4px;
    padding: 8px 13px;
    border: 1px solid var(--gold-light);
    border-radius: 8px;
    background: var(--beige);
    color: var(--maroon);
    font-size: 13px;
    cursor: pointer;
}

.suggestion:hover {
    background: var(--gold-light);
}

#message {
    margin-top: 22px;
    padding: 13px 15px;
    border-left: 3px solid var(--gold);
    border-radius: 0 8px 8px 0;
    background: #F8F3EC;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.7;
}

.note {
    margin-top: 16px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.8;
}

/* Mobile responsive */
@media (max-width: 600px) {
    body {
        padding: 18px 12px;
    }

    .container {
        margin: 8px auto;
        padding: 24px 19px;
        border-radius: 18px;
    }

    h1 {
        font-size: 36px;
    }

    .subtitle {
        margin-bottom: 25px;
        font-size: 14px;
    }

    textarea {
        min-height: 120px;
    }

    button {
        margin-top: 12px;
        padding: 12px 15px;
    }

    #output {
        font-size: 23px;
    }
}
</style>
